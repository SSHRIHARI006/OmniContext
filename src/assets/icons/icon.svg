<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Outer Context Circle (Gauge style) -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#1e293b" stroke-width="8" />
  <circle cx="64" cy="64" r="42" fill="none" stroke="url(#ringGrad)" stroke-width="8" 
          stroke-dasharray="264" stroke-dashoffset="66" stroke-linecap="round" filter="url(#glow)" />

  <!-- Center Hexagon / Core Token Node -->
  <polygon points="64,36 84,47 84,71 64,82 44,71 44,47" fill="#0284c7" fill-opacity="0.2" stroke="url(#ringGrad)" stroke-width="3" />

  <!-- Metrics Bars / Pulse Icon inside -->
  <path d="M50 64 L58 56 L66 68 L78 52" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Small Nodes -->
  <circle cx="50" cy="64" r="3" fill="#4ade80" />
  <circle cx="58" cy="56" r="3" fill="#38bdf8" />
  <circle cx="66" cy="68" r="3" fill="#818cf8" />
  <circle cx="78" cy="52" r="3" fill="#c084fc" />
</svg>
